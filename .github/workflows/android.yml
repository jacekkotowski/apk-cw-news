name: android
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Tests
        run: bash tests/run.sh
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ci.keystore
            printf 'KS_FILE=ci.keystore\nKS_PASS=%s\n' "$KS_PASS" > signing.env
          else
            keytool -genkeypair -keystore ci.keystore -storepass throwaway -keypass throwaway -alias ci -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=CW News CI"
            printf 'KS_FILE=ci.keystore\nKS_PASS=throwaway\n' > signing.env
          fi
      - name: Build
        run: ANDROID_SDK_ROOT="$ANDROID_HOME" bash build.sh
      - uses: actions/upload-artifact@v4
        with: { name: CWNews-apk, path: CWNews.apk }
      - name: Publish the release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -o 'versionName="[^"]*"' app/AndroidManifest.xml | cut -d'"' -f2)
          cp CWNews.apk "CWNews-$V.apk"
          if gh release view "v$V" > /dev/null 2>&1; then
            gh release upload "v$V" "CWNews-$V.apk" --clobber
          else
            sed "s/{{VERSION}}/$V/g" docs/RELEASE-NOTES.md > release-notes.md
            gh release create "v$V" "CWNews-$V.apk" --target "$GITHUB_SHA" --title "CW News $V" --notes-file release-notes.md
          fi
